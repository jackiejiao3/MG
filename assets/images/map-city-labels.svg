<svg xmlns="http://www.w3.org/2000/svg" width="3420" height="2214" viewBox="0 0 3420 2214" role="img" aria-label="Shanghai, Taicang, Suzhou, Wuxi and Zhangjiagang">
  <!-- Shared 56-unit bilingual baseline spacing; allow room for the English descenders. -->
  <g fill="#283b47" font-family="Arial, Microsoft YaHei, sans-serif" font-weight="700" text-anchor="middle">
    <g aria-label="Wuxi 无锡">
      <rect x="885" y="1049" width="190" height="116" rx="18" fill="white" fill-opacity=".86"/>
      <text x="980" y="1098" font-size="49">Wuxi</text>
      <text x="980" y="1154" font-size="42">无锡</text>
    </g>
    <g aria-label="Suzhou 苏州">
      <rect x="1181" y="1311" width="230" height="116" rx="18" fill="white" fill-opacity=".86"/>
      <text x="1296" y="1360" font-size="49">Suzhou</text>
      <text x="1296" y="1416" font-size="42">苏州</text>
    </g>
    <g aria-label="Zhangjiagang 张家港市">
      <rect x="1077.5" y="490" width="365" height="116" rx="18" fill="white" fill-opacity=".86"/>
      <text x="1260" y="539" font-size="49">Zhangjiagang</text>
      <text x="1260" y="595" font-size="42">张家港市</text>
    </g>
    <g aria-label="Taicang 太仓">
      <rect x="1801" y="1053" width="240" height="116" rx="18" fill="white" fill-opacity=".86"/>
      <text x="1921" y="1102" font-size="49">Taicang</text>
      <text x="1921" y="1158" font-size="42">太仓</text>
    </g>
    <g aria-label="Shanghai 上海">
      <rect x="2280" y="1404" width="280" height="116" rx="18" fill="white" fill-opacity=".86"/>
      <text x="2420" y="1453" font-size="49">Shanghai</text>
      <text x="2420" y="1509" font-size="42">上海</text>
    </g>
  </g>
</svg>
